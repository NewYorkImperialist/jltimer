name = "jltimer-api"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
# The jlTimer site(s) allowed to call this API.
ALLOWED_ORIGINS = "https://timer.jaydenlin.net,https://jaydenlin.net,https://newyorkimperialist.github.io,http://localhost:8081"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TURSO_URL       libsql://<db>-<org>.turso.io
#   TURSO_TOKEN     database auth token for this database only
#   SESSION_SECRET  32+ random characters
#   SETUP_TOKEN     one-time token for the first login setup; delete it afterwards
